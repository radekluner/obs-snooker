<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020939" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" />
  <title>Snooker Scoreboard Control</title>
  <link rel="stylesheet" href="/control.css" />
</head>
<body>
  <!--
    This page is meant to be added as its own OBS Browser Source (separate
    from the broadcast "/overlay" one) and clicked through OBS's built-in
    "Interact" mode (right-click the source -> Interact), as an alternative
    to this script's own Scripts-panel properties dialog or OBS Hotkeys.
    It is not meant to be shown to viewers - keep that source hidden/muted
    in the actual broadcast scene, or put it on its own unused scene.
  -->
  <div class="control-panel">
    <div class="players">
      <section class="player-column" data-player="1">
        <h2 class="player-name" id="player1-name">Player 1</h2>
        <div class="live-score">
          <span class="frame-score" id="player1-frame-score">0</span>
        </div>
        <div class="break-box" id="player1-break">
          <div class="break-top">
            <span class="break-label">BREAK</span>
            <span class="break-value" id="player1-break-value">0</span>
          </div>
          <span class="break-balls" id="player1-balls"></span>
        </div>

        <div class="ball-buttons" data-player="1">
          <button data-action="pot_ball" data-ball="red" aria-label="Red 1">1</button>
          <button data-action="pot_ball" data-ball="yellow" aria-label="Yellow 2">2</button>
          <button data-action="pot_ball" data-ball="green" aria-label="Green 3">3</button>
          <button data-action="pot_ball" data-ball="brown" aria-label="Brown 4">4</button>
          <button data-action="pot_ball" data-ball="blue" aria-label="Blue 5">5</button>
          <button data-action="pot_ball" data-ball="pink" aria-label="Pink 6">6</button>
          <button data-action="pot_ball" data-ball="black" aria-label="Black 7">7</button>
        </div>

      </section>

      <section class="shared-controls">
        <span class="turn-indicator" id="turn-indicator">-</span>
        <button class="switch-turn" data-action="switch_turn" aria-label="Switch turn" title="Switch turn (ends the break)">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M8 22h40M38 10l12 12-12 12M56 42H16M26 30L14 42l12 12" fill="none" stroke="currentColor"
                  stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="frame-controls">
          <button class="primary" data-action="win_frame">Wins frame</button>
          <button class="secondary" data-action="undo_ball">Undo last ball</button>
        </div>
        <div class="minor-controls">
          <button class="minor" data-action="reset_frame_scores">Reset frame score</button>
          <button class="minor fs-button" id="fullscreen-button" type="button" hidden>Fullscreen</button>
          <button class="club-logo" id="logo-button" type="button" aria-label="Show QR codes"><img src="/logo.svg" alt="Snooker Club Rozmarýn Brno" /></button>
        </div>
      </section>

      <section class="player-column" data-player="2">
        <h2 class="player-name" id="player2-name">Player 2</h2>
        <div class="live-score">
          <span class="frame-score" id="player2-frame-score">0</span>
        </div>
        <div class="break-box" id="player2-break">
          <div class="break-top">
            <span class="break-label">BREAK</span>
            <span class="break-value" id="player2-break-value">0</span>
          </div>
          <span class="break-balls" id="player2-balls"></span>
        </div>

        <div class="ball-buttons" data-player="2">
          <button data-action="pot_ball" data-ball="red" aria-label="Red 1">1</button>
          <button data-action="pot_ball" data-ball="yellow" aria-label="Yellow 2">2</button>
          <button data-action="pot_ball" data-ball="green" aria-label="Green 3">3</button>
          <button data-action="pot_ball" data-ball="brown" aria-label="Brown 4">4</button>
          <button data-action="pot_ball" data-ball="blue" aria-label="Blue 5">5</button>
          <button data-action="pot_ball" data-ball="pink" aria-label="Pink 6">6</button>
          <button data-action="pot_ball" data-ball="black" aria-label="Black 7">7</button>
        </div>

      </section>
    </div>

    <div class="qr-modal" id="qr-modal" hidden>
      <div class="qr-dialog" role="dialog" aria-label="QR codes">
        <div class="qr-items">
          <figure><div class="qr-code" id="qr-control"></div><figcaption>Control</figcaption></figure>
          <figure><div class="qr-code" id="qr-admin"></div><figcaption>Admin</figcaption></figure>
        </div>
        <p class="qr-hint">Naskenuj telefonem ve stejné Wi-Fi. Zavřeš klepnutím mimo okno.</p>
      </div>
    </div>

    <div class="toast" id="toast" role="alert" hidden></div>
  </div>
  <script src="/qrcode.js"></script>
  <script src="/nosleep.js"></script>
  <script src="/keepawake.js"></script>
  <script src="/control.js"></script>
</body>
</html>
